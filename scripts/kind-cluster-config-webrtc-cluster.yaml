kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  disableDefaultCNI: true
  podSubnet: "10.241.0.0/16"
  serviceSubnet: "10.97.0.0/16"
nodes:
- role: control-plane
  extraMounts:
  - hostPath: /sys/kernel/debug
    containerPath: /sys/kernel/debug
  - hostPath: /sys/fs/bpf
    containerPath: /sys/fs/bpf
- role: worker
  extraMounts:
  - hostPath: /sys/kernel/debug
    containerPath: /sys/kernel/debug
  - hostPath: /sys/fs/bpf
    containerPath: /sys/fs/bpf