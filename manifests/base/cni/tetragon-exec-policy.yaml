apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: monitor-execve
  namespace: kube-system
spec:
  kprobes:
    - call: "sys_execve"
      syscall: true
      args:
        - index: 0
          type: "string"
      selectors:
        - matchArgs:
            - index: 0
              operator: "Prefix"
              values:
                - "/bin/"
                - "/usr/bin/"