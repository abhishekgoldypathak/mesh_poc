apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-orchestrator-controller-manager
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: db-orchestrator-manager-role
rules:
- apiGroups: ["platform.ebpf.io"]
  resources: ["workspaces", "workspaces/status", "workspaces/finalizers"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["", "apps"]
  resources: ["namespaces", "services", "persistentvolumeclaims", "statefulsets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: db-orchestrator-manager-rolebinding
subjects:
- kind: ServiceAccount
  name: db-orchestrator-controller-manager
  namespace: kube-system
roleRef:
  kind: ClusterRole
  name: db-orchestrator-manager-role
  apiGroup: rbac.authorization.k8s.io