apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspace-service-sa
  namespace: business-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace-service
  namespace: business-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workspace-service
  template:
    metadata:
      labels:
        app: workspace-service
    spec:
      serviceAccountName: workspace-service-sa
      containers:
      - name: workspace-api
        image: workspace-service:v2
        imagePullPolicy: IfNotPresent
        env:
        - name: DATABASE_URL
          value: "postgresql+asyncpg://postgres:postgres@postgres-svc.business-app.svc.cluster.local:5432/ebpf_db"
        ports:
        - containerPort: 8000
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "250m"
        securityContext:
          runAsNonRoot: true
          runAsUser: 65532
          allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: workspace-service-svc
  namespace: business-app
spec:
  ports:
  - port: 8000
    targetPort: 8000
  selector:
    app: workspace-service