apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace-service
  namespace: business-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workspace-service
  template:
    metadata:
      labels:
        app: workspace-service
    spec:
      serviceAccountName: workspace-service-sa  # <-- Ensure SA is attached
      containers:
      - name: workspace-service
        image: workspace-service:v3              # <-- Update tag from v2 to v3
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000